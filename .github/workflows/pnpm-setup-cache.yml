name: pnpm/setup cache

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm with cache
        id: setup
        uses: pnpm/setup@v1
        with:
          cache: true

      - name: Show installed versions
        run: |
          echo "pnpm: $(pnpm --version)"
          echo "runtime: ${{ steps.setup.outputs.runtime-name }} ${{ steps.setup.outputs.runtime-version }}"
          case "${{ steps.setup.outputs.runtime-name }}" in
            node) node --version ;;
            bun) bun --version ;;
            deno) deno --version ;;
          esac

      - name: Run tests
        run: pnpm test

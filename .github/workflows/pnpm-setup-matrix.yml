name: pnpm/setup node matrix

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and Node.js ${{ matrix.node }}
        id: setup
        uses: pnpm/setup@v1
        with:
          runtime: node@${{ matrix.node }}
          version: 11.7.0
          install: false

      - name: Show installed versions
        run: |
          echo "pnpm: $(pnpm --version)"
          echo "runtime: ${{ steps.setup.outputs.runtime-name }} ${{ steps.setup.outputs.runtime-version }}"
          node --version

      - name: Explain skipped test
        if: matrix.node != 24
        run: |
          echo "Skipping pnpm test because package.json requires Node.js 24.16.0."
          echo "This matrix job only verifies that pnpm/setup installed Node.js ${{ matrix.node }} and pnpm successfully."

      - name: Run tests
        if: matrix.node == 24
        run: pnpm test

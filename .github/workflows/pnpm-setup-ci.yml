name: pnpm/setup with pnpm ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # ワークフロー実行対象のソースを取得する。
      - name: Checkout
        uses: actions/checkout@v6

      # packageManager と devEngines.runtime を見て pnpm と runtime をセットアップし、pnpm install は自動実行しない。
      - name: Setup pnpm with runtime
        id: setup
        uses: pnpm/setup@v1
        with:
          install: false

      # setup の outputs と実コマンドの両方で、実際に入ったバージョンを確認する。
      - name: Show installed versions
        run: |
          echo "pnpm: $(pnpm --version)"
          echo "runtime: ${{ steps.setup.outputs.runtime-name }} ${{ steps.setup.outputs.runtime-version }}"
          case "${{ steps.setup.outputs.runtime-name }}" in
            node) node --version ;;
            bun) bun --version ;;
            deno) deno --version ;;
          esac

      # lockfile ベースのクリーンインストールを明示的に実行する。
      - name: Install dependencies with pnpm ci
        run: pnpm ci

      # package.json の runtime 条件を満たす環境でテストを実行する。
      - name: Run tests
        run: pnpm test

name: pnpm/setup devEngines runtime

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # ワークフロー実行対象のソースを取得する。
      - name: Checkout
        uses: actions/checkout@v6

      # package.json の packageManager / devEngines.runtime を読んで pnpm と runtime をセットアップする。
      - name: Setup pnpm via devEngines.runtime
        id: setup
        uses: pnpm/setup@v1

      # setup の outputs と実コマンドの両方で、実際に入ったバージョンを確認する。
      - name: Show installed versions
        run: |
          echo "pnpm: $(pnpm --version)"
          echo "runtime: ${{ steps.setup.outputs.runtime-name }} ${{ steps.setup.outputs.runtime-version }}"
          case "${{ steps.setup.outputs.runtime-name }}" in
            node) node --version ;;
            bun) bun --version ;;
            deno) deno --version ;;
          esac

      # package.json の runtime 条件を満たす Node.js 上で pnpm test を実行する。
      - name: Run tests
        run: pnpm test

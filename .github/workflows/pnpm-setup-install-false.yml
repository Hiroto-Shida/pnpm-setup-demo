name: pnpm/setup install false

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      # ワークフロー実行対象のソースを取得する。
      - name: Checkout
        uses: actions/checkout@v6

      # pnpm と runtime だけを用意し、pnpm install は自動実行しない。
      - name: Setup pnpm without install
        id: setup
        uses: pnpm/setup@v1
        with:
          install: false

      # setup の outputs と実コマンドの両方で、実際に入ったバージョンを確認する。
      - name: Show installed versions
        run: |
          echo "pnpm: $(pnpm --version)"
          echo "runtime: ${{ steps.setup.outputs.runtime-name }} ${{ steps.setup.outputs.runtime-version }}"
          case "${{ steps.setup.outputs.runtime-name }}" in
            node) node --version ;;
            bun) bun --version ;;
            deno) deno --version ;;
          esac

      # node_modules が不要な pnpm audit を、install: false の例として実行する。
      - name: Run audit
        run: pnpm audit

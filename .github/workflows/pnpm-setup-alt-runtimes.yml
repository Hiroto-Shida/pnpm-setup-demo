name: pnpm/setup alt runtimes

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - runtime: bun@latest
            command: bun --version
          - runtime: deno@2
            command: deno --version

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and ${{ matrix.runtime }}
        id: setup
        uses: pnpm/setup@v1
        with:
          runtime: ${{ matrix.runtime }}
          version: 11.7.0
          install: false

      - name: Show installed versions
        run: |
          echo "pnpm: $(pnpm --version)"
          echo "runtime: ${{ steps.setup.outputs.runtime-name }} ${{ steps.setup.outputs.runtime-version }}"
          ${{ matrix.command }}
